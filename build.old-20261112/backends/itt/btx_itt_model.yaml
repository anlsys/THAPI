          :field_value_range: 64
          :preferred_display_base: 16
      - :name: namelen
        :field_class:
          :cast_type: int
          :type: integer_signed
          :field_value_range: 32
      - :name: name_val
        :field_class:
          :cast_type: char *
          :type: string
  - :name: lttng_ust_itt:__itt_event_start
    :payload_field_class:
      :type: structure
      :members:
      - :name: ittResult
        :field_class:
          :cast_type: int
          :type: integer_signed
          :field_value_range: 32
      - :name: event
        :field_class:
          :cast_type: __itt_event
          :type: integer_signed
          :field_value_range: 32
  - :name: lttng_ust_itt:__itt_event_end
    :payload_field_class:
      :type: structure
      :members:
      - :name: ittResult
        :field_class:
          :cast_type: int
          :type: integer_signed
          :field_value_range: 32
      - :name: event
        :field_class:
          :cast_type: __itt_event
          :type: integer_signed
          :field_value_range: 32
  - :name: lttng_ust_itt_metadata:metadata
    :payload_field_class:
      :type: structure
      :members:
      - :name: type
        :metadata:
          :be_class: ITT::IttMetadataType
        :field_class:
          :cast_type: __itt_metadata_type
          :type: integer_signed
          :field_value_range: 32
      - :name: count
        :field_class:
          :cast_type: size_t
          :type: integer_unsigned
          :field_value_range: 64
      - :name: data
        :field_class:
          :cast_type: void*
          :type: integer_unsigned
          :field_value_range: 64
          :preferred_display_base: 16
      - :name: _data_val_length
        :field_class:
          :cast_type: size_t
          :type: integer_unsigned
          :field_value_range: 64
      - :name: data_val
        :field_class:
