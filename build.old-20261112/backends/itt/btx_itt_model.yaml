    :payload_field_class:
      :type: structure
      :members:
      - :name: domain
        :field_class:
          :cast_type: __itt_domain *
          :type: integer_unsigned
          :field_value_range: 64
          :preferred_display_base: 16
  - :name: lttng_ust_itt:__itt_metadata_add
    :payload_field_class:
      :type: structure
      :members:
      - :name: domain
        :field_class:
          :cast_type: __itt_domain *
          :type: integer_unsigned
          :field_value_range: 64
          :preferred_display_base: 16
      - :name: id
        :metadata:
