        :field_class:
          :cast_type: __itt_metadata_type
          :type: integer_signed
          :field_value_range: 32
      - :name: count
        :field_class:
          :cast_type: size_t
          :type: integer_unsigned
          :field_value_range: 64
      - :name: data
        :field_class:
          :cast_type: void *
          :type: integer_unsigned
          :field_value_range: 64
          :preferred_display_base: 16
      - :name: key__strA_val
        :field_class:
