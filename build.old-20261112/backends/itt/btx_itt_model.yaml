      - :name: name
        :field_class:
          :cast_type: char *
          :type: integer_unsigned
          :field_value_range: 64
          :preferred_display_base: 16
  - :name: lttng_ust_itt:__itt_task_begin
    :payload_field_class:
      :type: structure
      :members:
      - :name: domain
        :field_class:
          :cast_type: __itt_domain *
          :type: integer_unsigned
          :field_value_range: 64
          :preferred_display_base: 16
      - :name: taskid
        :metadata:
          :be_class: ITT::IttId
        :field_class:
          :cast_type: __itt_id
          :type: string
          :cast_type_is_struct: true
      - :name: parentid
        :metadata:
          :be_class: ITT::IttId
        :field_class:
          :cast_type: __itt_id
          :type: string
          :cast_type_is_struct: true
      - :name: name
        :field_class:
          :cast_type: __itt_string_handle *
          :type: integer_unsigned
          :field_value_range: 64
          :preferred_display_base: 16
      - :name: domain__nameA_val
        :field_class:
          :cast_type: char *
          :type: string
      - :name: name__strA_val
        :field_class:
          :cast_type: char *
          :type: string
